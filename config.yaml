# ============================================================
#  i-am-active 配置文件
#
#  - 所有平台的账号 / 开关 / 抓取参数都在这里，脚本里不再写死。
#  - 值里可以写 ${环境变量名}，运行时替换；写 ${VAR:-默认值} 则变量缺省时用默认值。
#    密钥请用这种方式引用 GitHub Actions Secrets，不要直接写进仓库。
#  - enabled: false 的平台会被完全跳过（不影响其它平台）。
#  - 改完可用 `npm run collect -- --show-config` 检查解析结果（密钥会自动打码）。
# ============================================================

site:
  # GitHub Pages 的项目子路径；CI 里也可用环境变量 SITE_BASE 覆盖
  base: /i-am-active

collect:
  # true = 每个平台只抓「上次运行以来」的增量（记录在 res/state.json）
  # false = 每次都全量回溯（首次部署或补数据时可以临时关掉）
  incremental: true

platforms:
  # ---------------- 哔哩哔哩 ----------------
  bilibili:
    enabled: true
    # 空间页 https://space.bilibili.com/<mid>
    mid: "3494381151586530"
    # 匿名接口有概率性风控，失败时换指纹重试的次数
    retries: 14
    # 可选登录态：实测（2026-10）匿名请求被降级——动态列表只给最近十几条且
    # 不给 next_offset，翻不了页、投稿接口直接 412。想抓「入站以来的全部投稿
    # 和动态」就把浏览器里空间页的 Cookie（至少含 SESSDATA）填到环境变量
    # BILI_COOKIE（GitHub Actions 里存成同名 Secret）。
    cookie: ${BILI_COOKIE}

  # ---------------- YouTube ----------------
  youtube:
    enabled: false
    # 频道 ID（UC 开头），抓取用；不是 @handle
    channelId: UCuNJ-CHkXLcOf41aoip4x5w
    # 频道 handle，只用于拼主页地址（https://youtube.com/<handle>）
    handle: "@toad1145"
    # 可选：配了就优先走 Data API v3，不配则用频道 RSS（无需密钥）
    apiKey: ${YT_API_KEY}

  # ---------------- OTTOhub ----------------
  ottohub:
    enabled: true
    # 主页 https://www.ottohub.cn/u/<uid>
    uid: 22067

  # ---------------- 快手 ----------------
  kuaishou:
    enabled: true
    # 主页 https://www.kuaishou.com/profile/<profileId>
    profileId: xn57ehqqzfdqie
    # 快手作品列表需要登录态，公开接口一律 403；有 Cookie 时填这里
    cookie: ${KUAISHOU_COOKIE}

  # ---------------- GitHub ----------------
  # 提交 / Issue / PR 会按「一次连续动工」汇总成一张卡，不再一个提交一条。
  # 同一个仓库隔了几天再动，就是另一张卡（时间线上看得出节奏）。
  github:
    enabled: true
    user: Toad114514
    # 强烈建议配置：匿名只有 60 次/小时，很容易限流
    token: ${GITHUB_TOKEN}
    # 抓取窗口（天），0 = 全历史。仓库活动要装下「每次动工的全部提交」，
    # 所以默认不限时间：带 since 的话窗口边界每天推进，最老的几条提交会慢慢消失。
    lookbackDays: 0
    # 同一仓库相邻两次操作间隔超过这个分钟数，算另一次动工 → 拆成另一张卡
    sessionGapMinutes: 90
    # 单页条数（上限 100）与每个仓库最多翻几页
    perPage: 100
    maxPages: 2
    # 单张卡最多保留多少条明细、最多查多少个仓库
    maxRows: 300
    maxRepos: 40

  # ---------------- Gitee ----------------
  gitee:
    enabled: true
    user: toadstool
    lookbackDays: 0
    sessionGapMinutes: 90
    perPage: 100
    maxPages: 2
    maxRows: 300
    maxRepos: 40
    # 镜像同步的仓库：Gitee 那边只是 GitHub 的副本，同一批提交不该在时间线上
    # 出现两次，所以这些仓库的镜像提交会被丢掉，只在 GitHub 卡里体现一次。
    # 判据是提交 sha（镜像过去的提交两边完全一致），这里只需补「改了名」的对应
    # 关系——短名相同的（tpaxs / Staxle / milk-fk）能自动认出来，不用写。
    # Gitee 上真正独有的提交（直接推到 Gitee 的）照常出卡。
    mirrors:
      efopt: Efoptos
      hqkillboss: huaqiangbuymelon

  # ---------------- 编程猫（作品归档） ----------------
  # 这个号最早的一片足迹：2021 年起在上面发布的作品（Kitten4 源码编辑器 / Nemo）。
  # 公开列表接口不用登录，不需要密钥；实测最多只给最新 100 件
  # （total 停在 100、offset=100 直接返回空），更早的没有第二个人口能拿。
  # 抓取策略：首轮全量 init，之后只取第一页——盯「有没有新作品」和最新那件
  # 有没有被重新发布（publish_time 变了会在原条目上原地刷新）。
  codemao:
    enabled: true
    # 个人页 https://shequ.codemao.cn/mobile/user/<userId>
    userId: "16551623"
    # 全量 init 时每页条数（接口上限 100）与最多翻几页
    pageSize: 100
    maxPages: 3
    # 增量轮只取第一页多少条
    incrementalLimit: 20

  # ---------------- 互联网档案馆 ----------------
  archive:
    enabled: true
    # 账号页 https://archive.org/details/@<user>
    user: toad1145

  # ---------------- Weblate（TDE 项目） ----------------
  weblate:
    enabled: true
    baseUrl: https://mirror.git.trinitydesktop.org/weblate
    user: toad114514
    # 相邻改动间隔超过这个分钟数就算新的一段「翻译时段」，每段汇总成一条活动
    sessionGapMinutes: 120
    # 汇总窗口（天）：183 = 最近 6 个月（R16.1.x 的版本发布间隔）。
    # 注意 CI 每小时跑一次，增量轮翻页只会翻到「上次抓取 - 3 天」为止，
    # 不会每次都翻满 6 个月把匿名配额（100 次/24h）吃光。
    lookbackDays: 183
    # 单条汇总最多保留的逐条明细行数（页面每页显示 10 行）
    maxRows: 400
    pageSize: 50
    # 最多回翻页数：6 个月全量回填时一次性要翻的页数上限（首次运行/删掉 lastRun 后）
    maxPages: 20

  # ---------------- RHDC（romhacking.com）— 待接入，先别开 ----------------
  # TODO(2026-10-27)：等 toad114514 的改版真正发布到 RHDC 之后再写抓取器。
  #   要记的是「改版发布」和「版本更新」两类事件（不是成就、不是评论）。
  #   届时的做法：scripts/sources/rhdc.mjs + 这里打开 enabled，用户主页形如
  #   https://romhacking.com/user/toad114514 。
  #   现在**不要**加空配置：账号下还没有公开改版，抓了只会是空结果。
  # rhdc:
  #   enabled: false
  #   user: toad114514

  # ---------------- 主站博客（Hexo + Butterfly） ----------------
  hexo:
    enabled: true
    # hexo-generator-feed 生成的 Atom；本站点只有 atom.xml 有内容，
    # /rss.xml /feed.xml /rss2.xml /feed/ /index.xml 全是 404
    feedUrl: https://toad.ccwu.cc/atom.xml
    # feed 里的链接写的是 github.io，展示统一换成自定义域
    siteUrl: https://toad.ccwu.cc

  # ---------------- RetroAchievements ----------------
  retroachievements:
    enabled: true
    user: Toad114514
    # 在 https://retroachievements.org/settings 的 Keys 区域生成 Web API Key，
    # 然后存成环境变量 RA_API_KEY（GitHub Actions 里存成同名 Secret）。
    # 没有 key 时该平台会跳过并在日志里提示，其它平台不受影响。
    webApiKey: ${RA_API_KEY}
    # 首轮/全量回填时的回看上限（天）。之后的运行会按上次时间自动收窄窗口，
    # 所以这里只是个上限：删掉 state.json 里该平台的 lastRun 就会按它全量重抓一次。
    lookbackDays: 92
    # 每轮至少回看多少分钟（默认 4320 = 3 天）。
    # 作用：某轮失败（key 没配 / 401）时 lastRun 仍会往前走，窗口会缩到只剩两小时，
    # 那几天解锁的成就就永远补不回来。多回看几天只多花一次请求，去重不会产生重复。
    minWindowMinutes: 4320
    # 单次最多输出多少条成就（防止一口气灌进列表）。
    # 平时一轮只有几条，这个值只是保险；全量回填三个月时靠它放得下全部成就。
    maxItems: 500
    # 先用 GetUserProfile 校验用户名和 key，能提前发现配错
    profileCheck: true
    # 记录「最近玩过的游戏」（GetUserRecentlyPlayedGames）。
    # 成就接口只回「解锁了什么」，一场没拿成就的游戏靠这条才看得见。
    playSessions: true
    # 单轮最多看几款最近玩过的游戏
    maxGames: 30
    # 取游戏封面（没有就退回游戏内截图、再退回标题画面）当条目背景，
    # 成就徽章缩成右下角角标。每款游戏要额外一次 API_GetGame 请求，
    # 同一轮里同一款只查一次。
    gameArt: true
    # 单轮最多给几款游戏取图（回填时一轮可能撞上几十款）
    maxGameArt: 40
    # 两次取图请求之间的最小间隔（毫秒）。取图是一款一次请求，连着打容易被限速。
    artThrottleMs: 250

  # ---------------- Steam（可选，默认关闭） ----------------
  steam:
    enabled: true
    # https://steamcommunity.com/profiles/<steamId64>
    steamId64: ${STEAM_ID64}
    # https://steamcommunity.com/dev/apikey
    apiKey: ${STEAM_API_KEY}
    # 自动抓「最近两周玩过的游戏」再逐个查成就，不用手工维护 AppID
    recentGames: true
    # 记录「启动过哪款游戏」（来源是接口里的上次游玩时间，一次会话一条）
    # 关掉就只记录成就解锁
    playSessions: true
    # 单轮最多查几款游戏（按两周游玩时长从长到短取前 N）
    maxGames: 10
    # 单轮最多写入多少条（游玩记录 + 成就合计）。
    # 全量回填（删 lastRun）时三个固定游戏的历史成就会一次进来，60 根本装不下；
    # 平时增量一轮只有几条，这个值只是保险。
    maxItems: 500
    # 「没有上次抓取时间」时的回看窗口（天），0 = 成就全部历史。
    # 增量运行永远只看 [上次抓取, 现在]，这个值只在首轮/删 lastRun 回填时生效。
    lookbackDays: 0
    # 额外固定关注的 AppID（最近两周列表之外的常驻跟踪，排在前头优先检查）：
    # 477160 人类一败涂地 / 4000 Garry's Mod / 431960 Wallpaper Engine
    extraAppIds: [477160, 4000, 431960]

# ============================================================
#  i-am-active 配置文件
#
#  - 所有平台的账号 / 开关 / 抓取参数都在这里，脚本里不再写死。
#  - 值里可以写 ${环境变量名}，运行时替换；写 ${VAR:-默认值} 则变量缺省时用默认值。
#    密钥请用这种方式引用 GitHub Actions Secrets，不要直接写进仓库。
#  - enabled: false 的平台会被完全跳过（不影响其它平台）。
#  - 改完可用 `npm run collect -- --show-config` 检查解析结果（密钥会自动打码）。
# ============================================================

site:
  # GitHub Pages 的项目子路径；CI 里也可用环境变量 SITE_BASE 覆盖
  base: /i-am-active

collect:
  # true = 每个平台只抓「上次运行以来」的增量（记录在 res/state.json）
  # false = 每次都全量回溯（首次部署或补数据时可以临时关掉）
  incremental: true

platforms:
  # ---------------- 哔哩哔哩 ----------------
  bilibili:
    enabled: true
    # 空间页 https://space.bilibili.com/<mid>
    mid: "3494381151586530"
    # 匿名接口有概率性风控，失败时换指纹重试的次数
    retries: 14

  # ---------------- YouTube ----------------
  youtube:
    enabled: true
    # 频道 ID（UC 开头），抓取用；不是 @handle
    channelId: UCuNJ-CHkXLcOf41aoip4x5w
    # 频道 handle，只用于拼主页地址（https://youtube.com/<handle>）
    handle: "@toad1145"
    # 可选：配了就优先走 Data API v3，不配则用频道 RSS（无需密钥）
    apiKey: ${YT_API_KEY}

  # ---------------- OTTOhub ----------------
  ottohub:
    enabled: true
    # 主页 https://www.ottohub.cn/u/<uid>
    uid: 22067

  # ---------------- 快手 ----------------
  kuaishou:
    enabled: true
    # 主页 https://www.kuaishou.com/profile/<profileId>
    profileId: xn57ehqqzfdqie
    # 快手作品列表需要登录态，公开接口一律 403；有 Cookie 时填这里
    cookie: ${KUAISHOU_COOKIE}

  # ---------------- GitHub ----------------
  # 提交 / Issue / PR 会按「仓库 + 时间空档」汇总成一张卡，不再一个提交一条。
  github:
    enabled: true
    user: Toad114514
    # 强烈建议配置：匿名只有 60 次/小时，很容易限流
    token: ${GITHUB_TOKEN}
    # 汇总窗口（天），0 = 全历史。仓库卡要装下「这个仓库的全部操作」，
    # 所以默认不限时间：带 since 的话窗口边界每天推进，最老的几条提交会慢慢消失。
    lookbackDays: 0
    # 同一仓库相邻两次操作间隔超过这个分钟数，算另一次动工 → 卡内另起一段
    sessionGapMinutes: 90
    # 单页条数（上限 100）与每个仓库最多翻几页
    perPage: 100
    maxPages: 2
    # 单张卡最多保留多少条明细、最多查多少个仓库
    maxRows: 300
    maxRepos: 40

  # ---------------- Gitee ----------------
  gitee:
    enabled: true
    user: toadstool
    lookbackDays: 0
    sessionGapMinutes: 90
    perPage: 100
    maxPages: 2
    maxRows: 300
    maxRepos: 40

  # ---------------- 互联网档案馆 ----------------
  archive:
    enabled: true
    # 账号页 https://archive.org/details/@<user>
    user: toad1145

  # ---------------- Weblate（TDE 项目） ----------------
  weblate:
    enabled: true
    baseUrl: https://mirror.git.trinitydesktop.org/weblate
    user: toad114514
    # 相邻改动间隔超过这个分钟数就算新的一段「翻译时段」，每段汇总成一条活动
    sessionGapMinutes: 120
    lookbackDays: 7
    # 单条汇总最多保留的逐条明细行数（页面每页显示 10 行）
    maxRows: 400
    pageSize: 50
    maxPages: 4

  # ---------------- 主站博客（Hexo + Butterfly） ----------------
  hexo:
    enabled: true
    # hexo-generator-feed 生成的 Atom；本站点只有 atom.xml 有内容，
    # /rss.xml /feed.xml /rss2.xml /feed/ /index.xml 全是 404
    feedUrl: https://toad.ccwu.cc/atom.xml
    # feed 里的链接写的是 github.io，展示统一换成自定义域
    siteUrl: https://toad.ccwu.cc

  # ---------------- RetroAchievements ----------------
  retroachievements:
    enabled: true
    user: Toad114514
    # 在 https://retroachievements.org/settings 的 Keys 区域生成 Web API Key，
    # 然后存成环境变量 RA_API_KEY（GitHub Actions 里存成同名 Secret）。
    # 没有 key 时该平台会跳过并在日志里提示，其它平台不受影响。
    webApiKey: ${RA_API_KEY}
    # 首轮/全量回填时的回看上限（天）。之后的运行会按上次时间自动收窄窗口，
    # 所以这里只是个上限：删掉 state.json 里该平台的 lastRun 就会按它全量重抓一次。
    lookbackDays: 92
    # 每轮至少回看多少分钟（默认 4320 = 3 天）。
    # 作用：某轮失败（key 没配 / 401）时 lastRun 仍会往前走，窗口会缩到只剩两小时，
    # 那几天解锁的成就就永远补不回来。多回看几天只多花一次请求，去重不会产生重复。
    minWindowMinutes: 4320
    # 单次最多输出多少条成就（防止一口气灌进列表）。
    # 平时一轮只有几条，这个值只是保险；全量回填三个月时靠它放得下全部成就。
    maxItems: 500
    # 先用 GetUserProfile 校验用户名和 key，能提前发现配错
    profileCheck: true
    # 记录「最近玩过的游戏」（GetUserRecentlyPlayedGames）。
    # 成就接口只回「解锁了什么」，一场没拿成就的游戏靠这条才看得见。
    playSessions: true
    # 单轮最多看几款最近玩过的游戏
    maxGames: 30
    # 取游戏封面（没有就退回游戏内截图、再退回标题画面）当条目背景，
    # 成就徽章缩成右下角角标。每款游戏要额外一次 API_GetGame 请求，
    # 同一轮里同一款只查一次。
    gameArt: true
    # 单轮最多给几款游戏取图（回填时一轮可能撞上几十款）
    maxGameArt: 40
    # 两次取图请求之间的最小间隔（毫秒）。取图是一款一次请求，连着打容易被限速。
    artThrottleMs: 250

  # ---------------- Steam（可选，默认关闭） ----------------
  steam:
    enabled: true
    # https://steamcommunity.com/profiles/<steamId64>
    steamId64: ${STEAM_ID64}
    # https://steamcommunity.com/dev/apikey
    apiKey: ${STEAM_API_KEY}
    # 自动抓「最近两周玩过的游戏」再逐个查成就，不用手工维护 AppID
    recentGames: true
    # 记录「启动过哪款游戏」（来源是接口里的上次游玩时间，一次会话一条）
    # 关掉就只记录成就解锁
    playSessions: true
    # 单轮最多查几款游戏（按两周游玩时长从长到短取前 N）
    maxGames: 10
    # 单轮最多写入多少条（游玩记录 + 成就合计）
    maxItems: 60
    # 额外固定关注的 AppID，想长期跟踪某款老游戏时填（如 [730, 570]）
    extraAppIds: []
